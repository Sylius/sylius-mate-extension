# Deliberate fixtures on top of the stock Sylius test application. Every value here
# is asserted by name in tests/Integration — change both sides together.
imports:
    - { resource: 'services.yaml' }

doctrine:
    orm:
        mappings:
            MateTest:
                type: attribute
                dir: '%kernel.project_dir%/../../../tests/TestApplication/src/Entity'
                prefix: Sylius\MateExtension\Tests\TestApplication\Entity
                is_bundle: false

# project-owned resource with Sylius defaults (no custom factory/repository), asserted by resource tools' tests
sylius_resource:
    resources:
        mate_test.book:
            classes:
                model: Sylius\MateExtension\Tests\TestApplication\Entity\Book

twig:
    paths:
        '%kernel.project_dir%/../../../tests/TestApplication/templates': ~

sylius_grid:
    grids:
        mate_test_book:
            driver:
                name: doctrine/orm
                options:
                    class: Sylius\MateExtension\Tests\TestApplication\Entity\Book
            fields:
                id:
                    type: string
                title:
                    type: string
            filters:
                title:
                    type: string
            actions:
                main:
                    create:
                        type: create
                    # deliberate mistake: delete is item-scoped, sylius_grid_actions_audit must flag it
                    delete:
                        type: delete
                item:
                    update:
                        type: update
