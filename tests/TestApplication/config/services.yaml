services:
    Sylius\MateExtension\Tests\TestApplication\Twig\MateTestExtension:
        tags: ['twig.extension']

    Sylius\MateExtension\Tests\TestApplication\Controller\PingController:
        tags: ['controller.service_arguments']

    # project-owned decoration chain of one sylius.* service, asserted by sylius_service_decorators tests:
    # the higher decoration_priority wraps the original directly (inner), the lower one wraps that (outer)
    Sylius\MateExtension\Tests\TestApplication\Calculator\InnerProductVariantPricesCalculator:
        decorates: sylius.calculator.product_variant_price
        decoration_priority: 10
        arguments:
            - '@.inner'

    Sylius\MateExtension\Tests\TestApplication\Calculator\OuterProductVariantPricesCalculator:
        decorates: sylius.calculator.product_variant_price
        decoration_priority: 0
        arguments:
            - '@.inner'
